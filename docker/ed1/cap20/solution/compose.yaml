# cap20 solution - a three-service application in one file. Compose creates the
# network declared here and puts the services on it, so they reach each other by
# name; the named volume gives db a piece of state that survives the container;
# depends_on makes db start before web; and the tools service, hidden behind a
# profile, is defined here but does not start unless it is asked for. One file,
# one command (up/down).
services:
  db:
    image: busybox
    command: sleep 3600
    networks:
      - appnet
    volumes:
      - dbdata:/var/lib/db
  web:
    image: busybox
    command: sleep 3600
    depends_on:
      - db
    networks:
      - appnet
  cache:
    image: busybox
    command: sleep 3600
    networks:
      - appnet
  tools:
    image: busybox
    command: sleep 3600
    networks:
      - appnet
    profiles:
      - tools

networks:
  appnet:

volumes:
  dbdata:
