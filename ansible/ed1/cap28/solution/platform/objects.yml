# AWX / Automation Platform objects, defined as code (GitOps), in a teaching format for
# this exercise: your CI validates it, and a real import translates it into AWX API
# objects or awx.awx modules. No secret value lives here - only
# the link the controller follows to fetch it from a secret manager when the job runs.

projects:
  - name: infra-playbooks
    scm_type: git
    scm_url: https://example.com/acme/infra-playbooks.git

inventories:
  - name: production
    source: static

credentials:
  # The external credential: how the controller reaches the secret manager. Only the
  # address travels in git; its own authentication (a token, an AppRole) is set on
  # the controller, never here.
  - name: vault-lookup
    credential_type: HashiCorp Vault Secret Lookup
    inputs:
      url: https://vault.example.com:8200
      api_version: v2
  # The credential the job templates use. Its key field is NOT in inputs: the
  # controller fills it at launch from vault-lookup, through the input source below.
  - name: deploy-ssh
    credential_type: Machine
    inputs:
      username: deploy

# The link, not the value: which field of which credential comes from which secret
# manager, and where the secret sits there (the metadata). This is how AWX pulls a
# secret from a third-party system - it does not evaluate a lookup expression written
# into the field.
credential_input_sources:
  - target_credential: deploy-ssh
    input_field_name: ssh_key_data
    source_credential: vault-lookup
    metadata:
      secret_path: /kv/ansible/deploy-ssh
      secret_key: ssh_key

job_templates:
  - name: deploy
    project: infra-playbooks
    inventory: production
    playbook: deploy.yml
    credentials: [deploy-ssh]
    limit: webfarm
  - name: smoke-test
    project: infra-playbooks
    inventory: production
    playbook: smoke.yml
    credentials: [deploy-ssh]
  - name: rollback
    project: infra-playbooks
    inventory: production
    playbook: rollback.yml
    credentials: [deploy-ssh]

rbac:
  # Least privilege: the deployers team may EXECUTE the deploy job template, and
  # nothing more - not admin over the organisation.
  - team: deployers
    role: execute
    resource: job_template:deploy

workflows:
  - name: release
    nodes:
      - id: n_deploy
        job_template: deploy
        success_nodes: [n_smoke]
        failure_nodes: [n_rollback]
      - id: n_smoke
        job_template: smoke-test
        failure_nodes: [n_rollback]
      - id: n_rollback
        job_template: rollback
