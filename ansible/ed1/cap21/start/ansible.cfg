[defaults]
host_key_checking = False

[inventory]
# enable_plugins is optional (21.2): auto, on by default, would load the
# docker plugin anyway. Listing plugins here replaces the default list. The docker one reads
# inventory.docker.yml; ini/yaml read the static inventory.ini.
enable_plugins = community.docker.docker_containers, ansible.builtin.ini, ansible.builtin.yaml, auto
