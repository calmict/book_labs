# The robot: an identity for a workload, and the pod that wears it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robot
  namespace: lab-cap21
---
apiVersion: v1
kind: Pod
metadata:
  name: robot
  namespace: lab-cap21
spec:
  # TODO 2 (21.2): set serviceAccountName to robot, so the workload gets
  # its own mounted identity instead of the namespace's default identity.
  containers:
    - name: robot
      image: curlimages/curl:latest
      command: ["sleep", "infinity"]
