# The vault does not make phone calls: whoever cracks it carries
# nothing out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-exfiltration
  namespace: vault
spec:
  # TODO 3 (22.3): select app=safe and govern Egress without allow
  # rules, because silence prevents the vault from making calls.
  podSelector: {matchLabels: {todo: replace-me}}
  policyTypes: ["Egress"]
