# Three lines that invert the world: every pod selected, Ingress ruled,
# no rules = no entry. Read it, then apply it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: vault
spec:
  # TODO 1 (22.2): select every pod and govern Ingress without allow
  # rules, because an empty permission set turns default allow into deny.
  podSelector: {matchLabels: {todo: replace-with-empty-selector}}
  policyTypes: ["Ingress"]
