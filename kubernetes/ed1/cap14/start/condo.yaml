apiVersion: v1
kind: Pod
metadata:
  name: condo
spec:
  volumes:
    - name: www
      emptyDir: {}
  containers:
    - name: web
      image: busybox:stable
      command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
      volumeMounts:
        - name: www
          mountPath: /www
    # TODO 1 (14.1): add the writer tenant so two containers can prove
    # that one Pod shares localhost and the www volume. Use busybox:stable,
    # running
    #   sh -c 'while :; do date > /www/index.html; sleep 2; done'
    # and mounting the same www volume on /www
