apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread
spec:
  replicas: 2
  # Recreate: with a strict anti-affinity, a rolling update can deadlock
  # (no free node for the surge pod) — a taste of more advanced traps.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spread
  template:
    metadata:
      labels:
        app: spread
    spec:
      # TODO 3 (11.3): add required podAntiAffinity for app: spread with
      # topologyKey kubernetes.io/hostname. The strict rule makes each
      # replica require a different node and exposes an impossible third.
      containers:
        - name: sleeper
          image: alpine:3
          command: ["sleep", "infinity"]
