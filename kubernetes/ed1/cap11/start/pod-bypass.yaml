apiVersion: v1
kind: Pod
metadata:
  name: bypass
spec:
  # TODO 1 (11.1): set nodeName to book-labs-sched-worker. Assigning the
  # node here bypasses the scheduler while leaving execution to the kubelet.
  # nodeName: <which-node?>
  containers:
    - name: sleeper
      image: alpine:3
      command: ["sleep", "infinity"]
