apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  labels:
    app: shop
spec:
  # TODO 1 (15.2): set three replicas so the ReplicaSet guards the count.
  # TODO 2 (15.3): add the zero-downtime RollingUpdate strategy so a
  # broken release cannot reduce available capacity; use
  # maxSurge 1 and maxUnavailable 0
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: sleeper
          # TODO 3 (15.3): set alpine:3.19 as the opening revision so the
          # later update and rollback have a known baseline.
          command: ["sleep", "infinity"]
