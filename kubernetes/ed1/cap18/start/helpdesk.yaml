# Two operators answering with their own name, and the switchboard
# (Service) in front of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk
  labels:
    app: helpdesk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helpdesk
  template:
    metadata:
      labels:
        app: helpdesk
    spec:
      containers:
        - name: operator
          image: busybox:stable
          command: ["sh", "-c", "mkdir -p /www; hostname > /www/index.html; httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk
spec:
  # TODO 1 (18.2): select app=helpdesk, so the Service follows the
  # replaceable operators instead of one ephemeral Pod address.
  # TODO 2 (18.2): expose Service port 80, so clients have one stable
  # ClusterIP port while operators come and go.
  # TODO 3 (18.2): route that port towards targetPort 8080, where the
  # operators actually listen.
