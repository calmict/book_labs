apiVersion: apps/v1
kind: Deployment
metadata:
  # Continue TODO 1 for the Deployment name and matching labels.
  name: CHANGE-ME
spec:
  # Continue TODO 2 by reading the replica count from values.
  replicas: CHANGE-ME
  selector:
    matchLabels:
      app: CHANGE-ME
  template:
    metadata:
      labels:
        app: CHANGE-ME
      annotations:
        # TODO 3 (24.3): hash the rendered ConfigMap into checksum/config,
        # because a values-only config change must trigger a deterministic rollout.
    spec:
      containers:
        - name: greeter
          image: busybox:stable
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /www
      volumes:
        - name: page
          configMap:
            # Continue TODO 1 for the referenced ConfigMap name.
            name: CHANGE-ME-page
