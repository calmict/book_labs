apiVersion: v1
kind: Pod
metadata:
  name: moody
  labels:
    app: moody
spec:
  containers:
    - name: moody
      image: alpine:3
      command: ["sh", "-c", "touch /tmp/ready; sleep infinity"]
      # TODO 2 (12.2): add an exec readinessProbe that runs test -f
      # /tmp/ready every 3 seconds with failureThreshold 2. It must remove
      # the Pod from Service traffic without restarting the container.
---
apiVersion: v1
kind: Service
metadata:
  name: moody
spec:
  selector:
    app: moody
  ports:
    - port: 80
