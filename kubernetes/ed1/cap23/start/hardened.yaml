# The stripped king: same workload, but locked down from the inside.
# TODO 1 (23.2): run as uid 65534 with runAsNonRoot, because uid 0 is
# unnecessary authority for this workload.
# TODO 2 (23.2): forbid privilege escalation, make the root filesystem
# read-only, and drop ALL capabilities to reduce the writable attack surface.
# TODO 3 (23.3): select RuntimeDefault seccomp, because the shared kernel
# should accept only the workload's expected syscall baseline.
# When you are done, this pod must also satisfy the "restricted" Pod
# Security Standard (step 3) — the same five settings are what the
# admission guard checks for.
apiVersion: v1
kind: Pod
metadata:
  name: hardened
  namespace: throne
  labels:
    app: hardened
spec:
  containers:
    - name: crown
      image: busybox:stable
      command: ["sleep", "infinity"]
      securityContext: {}
