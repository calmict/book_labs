# The arranged marriage: a hand-made volume, the claim that asks for it,
# and the writer that stores the dowry.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-pv
spec:
  capacity:
    storage: 50Mi
  accessModes: ["ReadWriteOnce"]
  # TODO 3 (20.3): choose Retain so the dowry survives claim deletion.
  persistentVolumeReclaimPolicy: Delete
  storageClassName: manual
  hostPath:
    path: /tmp/manual-pv
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bride
  namespace: lab-cap20
spec:
  # TODO 1 (20.1): ask for 30Mi of the manual class with ReadWriteOnce,
  # so the binder can match this claim to the compatible hand-made PV.
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: lab-cap20
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: bride
  containers:
    - name: writer
      image: alpine:3
      command: ["sh", "-c", "echo dote > /data/dote.txt; sleep infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
