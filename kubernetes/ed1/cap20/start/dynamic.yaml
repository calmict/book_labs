# The automatic matchmaker: no storageClassName means the default class,
# and the tenant pod is what convinces it to act (WaitForFirstConsumer:
# the provisioner waits to know WHERE the volume is needed).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloud
  namespace: lab-cap20
spec:
  # TODO 2 (20.2): request 30Mi with ReadWriteOnce and omit
  # storageClassName, so the default class provisions a PV on demand.
---
apiVersion: v1
kind: Pod
metadata:
  name: tenant
  namespace: lab-cap20
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: cloud
  containers:
    - name: tenant
      image: alpine:3
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
