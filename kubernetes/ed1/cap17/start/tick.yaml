apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
spec:
  # TODO 3 (17.3): schedule this every minute, so you can observe the
  # CronJob -> Job -> Pod delegation chain.
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: alpine:3
              command: ["sh", "-c", "echo tick at $(date)"]
