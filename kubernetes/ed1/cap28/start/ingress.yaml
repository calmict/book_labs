# The doorman's routing rule. It routes HTTP already, but the three gaps below
# must be filled before cert-manager can give it a TLS passport.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # TODO 1 (28.4): select the local-ca ClusterIssuer here, so cert-manager
    # knows which authority must issue the certificate.
spec:
  ingressClassName: traefik
  # TODO 2 (28.4): add a tls block with shop.book-labs.local in its hosts list,
  # so the certificate identity matches the hostname used by the visitor.
  # TODO 3 (28.4): set that tls entry's secretName to shop-tls, so
  # cert-manager and Traefik agree where the key and certificate live.
  rules:
    - host: shop.book-labs.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
